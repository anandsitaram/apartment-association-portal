name: Mobile Android APK (React Native)

on:
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Install dependencies
        working-directory: mobile
        run: npm install --ignore-scripts --legacy-peer-deps
      - name: Compute version info
        id: version
        working-directory: mobile
        run: |
          echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PVERSION_NAME=${{ steps.version.outputs.name }} \
            -PVERSION_CODE=${{ steps.version.outputs.code }}
      - name: Rename APK
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
             "dist/my-apartment-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: my-apartment-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: dist/*.apk
          retention-days: 2
