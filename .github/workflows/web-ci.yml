name: Web CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (refresh lockfile after platform dependency changes)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck and run regression tests
        run: npm run check
      - name: Build production web app
        run: npm run build
      - name: Upload production build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: rv-fallon-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
